<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pembuat Tautan Tamu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Figtree:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .tool { max-width: 640px; margin: 0 auto; }
  .tool .sec__in { align-items: stretch; text-align: left; gap: 20px; min-height: 100vh; }
  .tool .title, .tool .lead { text-align: left; }
  .links { display: flex; flex-direction: column; }
  .link { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding-block: 14px; border-top: 1px solid var(--line); }
  .link b { overflow-wrap: anywhere; min-width: 0; }
  .link code { grid-column: 1; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; min-width: 0; user-select: all; }
  .link .btn { grid-row: 1 / span 2; grid-column: 2; min-height: 38px; padding: 4px 16px; }
</style>
</head>
<body>
<main class="sec sec--wengi tool">
  <div class="sec__in">
    <h1 class="title">Tautan untuk tiap tamu</h1>
    <p class="lead">Tulis satu nama per baris. Setiap tamu mendapat tautan yang menampilkan namanya di sampul undangan.</p>
    <div class="field">
      <label for="names">Daftar nama tamu</label>
      <textarea id="names" rows="7" placeholder="Bapak Hendra &amp; Ibu Sari&#10;Mbak Anastasia&#10;Keluarga Besar Pak Darto"></textarea>
    </div>
    <div class="field">
      <label for="msg">Pesan pengantar (opsional, ikut tersalin)</label>
      <textarea id="msg" rows="4">Berkah Dalem. Tanpa mengurangi rasa hormat, izinkan kami mengundang {nama} ke acara pernikahan kami. Undangan selengkapnya: {tautan}</textarea>
    </div>
    <div class="links" id="links"></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
  var names = document.getElementById('names'), msg = document.getElementById('msg'), out = document.getElementById('links');
  var base = location.href.replace(/[?#].*$/, '').replace(/tamu\.html$/, '');
  function toast(t) { var n = document.getElementById('toast'); n.textContent = t; n.hidden = false; setTimeout(function () { n.hidden = true; }, 1800); }
  function render() {
    out.textContent = '';
    names.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (name) {
      var url = base + '?to=' + encodeURIComponent(name).replace(/%20/g, '+');
      var row = document.createElement('div'); row.className = 'link';
      var b = document.createElement('b'); b.textContent = name;
      var c = document.createElement('code'); c.textContent = url;
      var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'btn'; btn.textContent = 'Salin';
      btn.addEventListener('click', function () {
        var text = msg.value.trim() ? msg.value.replace(/\{nama\}/g, name).replace(/\{tautan\}/g, url) : url;
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast('Tersalin untuk ' + name); }, function () { toast('Salin manual dari teks tautan'); });
        else toast('Salin manual dari teks tautan');
      });
      row.appendChild(b); row.appendChild(c); row.appendChild(btn); out.appendChild(row);
    });
  }
  names.addEventListener('input', render);
})();
</script>
</body>
</html>
